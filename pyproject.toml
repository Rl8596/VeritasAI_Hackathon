[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumoshift"
version = "0.1.0"
description = "Does a pneumonia X-ray model trained on children still work on adults? Hackathon project."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
